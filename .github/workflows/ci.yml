name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Linux is the reference platform for the backend. If this job fails, the
    # claim in README.md is false.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve BioNetGen
        # PySB cannot generate a reaction network without it, so fail loudly here
        # rather than inside a confusing solver error later.
        run: |
          PYTHONPATH=sim python -c "
          from vervain.solve.engine import ensure_bngpath
          p = ensure_bngpath()
          print('BioNetGen:', p)
          raise SystemExit(0 if p else 'BioNetGen not found')
          "
      - name: Tests
        run: PYTHONPATH=sim python -m pytest tests -q
      - name: Solver smoke test
        # Exercises the whole chain: PySB -> BioNetGen -> SBML -> RoadRunner.
        run: PYTHONPATH=sim python -m vervain.validate.sweep

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm run build
        working-directory: web
