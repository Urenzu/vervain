name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI cannot run the simulation. GROMACS needs a GPU to be worth building and a
# trajectory takes days, so what is checked here is everything upstream of the
# integrator: the catalogue parses, structures are fetchable, the viewer builds.
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Structure catalogue parses
        run: PYTHONPATH=sim python -m vervain.structures list

      - name: Structures are reachable and inspectable
        # Catches a retracted or superseded PDB entry, and any regression in the
        # parser that would silently report zero gaps.
        run: |
          PYTHONPATH=sim python -m vervain.structures fetch 6M0J
          PYTHONPATH=sim python -m vervain.structures inspect 6M0J

      - name: Toolchain report runs without a toolchain
        # doctor has to survive a machine with no GPU and no GROMACS — that is
        # precisely when someone runs it.
        run: PYTHONPATH=sim python -m vervain.doctor

      - name: Tests
        run: |
          pip install -q pytest
          PYTHONPATH=sim python -m pytest tests -q

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx --prefix web tsc -b
      - run: npm run build --prefix web
