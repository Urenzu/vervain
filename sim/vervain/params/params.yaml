# Vervain parameter registry — the single source of truth.
#
# Every PySB Parameter in the model must appear here, keyed by its exact name.
# `tests/test_param_provenance.py` fails the build otherwise.
#
# Schema per entry:
#   value:      float, in the units given below
#   units:      explicit; bimolecular rates are per-molecule-per-second in the
#               compartment named by `compartment`, NOT molar
#   compartment: which volume the rate is defined in (sets the unit conversion)
#   confidence: measured  - direct experimental value for SARS-CoV-2
#               analogous - measured for a related coronavirus or comparable process
#               inferred  - fit to aggregate data
#               estimated - order-of-magnitude argument from first principles
#   source:     citation. `UNVERIFIED` is a legal value and means the number is a
#               placeholder that has NOT been traced to literature yet. The
#               provenance test permits it; the pre-calibration audit does not.
#   note:       why this value, and what would change it
#
# ============================== v0 STATUS ===================================
# EVERY value below is `estimated` / UNVERIFIED. They were chosen to put the model
# in a plausible dynamic regime so the pipeline can be exercised end to end, NOT
# by tracing literature. Calibration against docs/validation.md is the next step.
# Nothing produced from this parameter set is a result.
# ============================================================================

schema_version: 1

parameters:

  # ---- entry ---------------------------------------------------------------

  ACE2_0:
    value: 5.0e4
    units: molecules/cell
    compartment: plasma_membrane
    confidence: estimated
    source: UNVERIFIED
    note: >
      ACE2 surface copy number on a ciliated airway epithelial cell. Varies widely
      between cells and is a plausible driver of the productive/abortive split on
      its own — keep in the sensitivity sweep whatever the literature value is.

  TMPRSS2_0:
    value: 1.0e4
    units: molecules/cell
    compartment: plasma_membrane
    confidence: estimated
    source: UNVERIFIED
    note: Sets the surface-vs-endosomal route split, which entry is validated on.

  kf_S_ACE2:
    value: 1.0e-6
    units: 1/(molecule*s)
    compartment: plasma_membrane
    confidence: estimated
    source: UNVERIFIED
    note: >
      Spike-to-ACE2 association. Literature reports an equilibrium KD for isolated
      RBD; turning that into an on-rate for a multivalent virion at a membrane is a
      modeling decision, not a measurement. Record the decision here when made.

  kr_S_ACE2:
    value: 1.0e-4
    units: 1/s
    compartment: plasma_membrane
    confidence: estimated
    source: UNVERIFIED
    note: Paired with kf_S_ACE2; only the ratio is constrained by a reported KD.

  k_fuse_tmprss2:
    value: 1.0e-6
    units: 1/(molecule*s)
    compartment: plasma_membrane
    confidence: estimated
    source: UNVERIFIED
    note: Surface fusion route. Dominant when TMPRSS2 is present.

  k_endocytose:
    value: 1.0e-4
    units: 1/s
    compartment: plasma_membrane
    confidence: estimated
    source: UNVERIFIED
    note: Competing endosomal route; slower than surface fusion by construction.

  k_uncoat_cathepsinL:
    value: 1.0e-3
    units: 1/s
    compartment: endosome
    confidence: estimated
    source: UNVERIFIED
    note: Cathepsin L-dependent uncoating, ~15 min timescale.

  # ---- translation and antagonists ----------------------------------------

  k_translate_orf1ab:
    value: 2.0e-3
    units: 1/s per gRNA
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Lumps ribosome loading, elongation over 21 kb, frameshifting and polyprotein
      cleavage into one rate. Splitting these is a milestone-6 refinement.

  k_make_nsp1:
    value: 2.0e-3
    units: 1/s per gRNA
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: nsp1 is an ORF1ab product, so it tracks ORF1ab translation.

  k_make_orf6:
    value: 1.0e-3
    units: 1/s per sgRNA
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: ORF6 is accessory, expressed from subgenomic mRNA — hence later than nsp1.

  k_translate_struct:
    value: 5.0e-3
    units: 1/s per sgRNA
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: Per-sgRNA structural protein output, N and S treated identically in v0.

  # ---- DMV and replication -------------------------------------------------

  k_form_dmv:
    value: 4.0e-7
    units: 1/s per nsp
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Tuned so DMV count lands near 1-2 at 2 hpi and tens by 10 hpi, matching the
      smFISH replication-factory counts. This is the first parameter to calibrate
      properly because the count is directly measured.

  k_synth_negative:
    value: 1.0e-5
    units: 1/(molecule*s)
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: >
      Negative-strand synthesis, requiring both a genome template and DMV capacity.
      Bimolecular in (gRNA, DMV) is what makes DMVs rate-limiting early.

  k_synth_positive:
    value: 1.0e-2
    units: 1/s per ngRNA
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: Positive-strand amplification off the negative template. Sets burst growth.

  k_synth_subgenomic:
    value: 3.0e-2
    units: 1/s per ngRNA
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: >
      Higher than positive-strand synthesis, reflecting sgRNA excess over gRNA.
      smFISH reports sgRNA/gRNA between 0.5 and 8 over time — a direct target.

  k_dsRNA_leak:
    value: 1.0e-4
    units: 1/s
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: >
      Escape of replication intermediates from the DMV into the cytosol. THE most
      important parameter in the model: it alone sets how much the cell can see,
      and therefore where the productive/abortive boundary sits.

  k_dsRNA_decay:
    value: 1.0e-3
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: Cytosolic nuclease clearance of leaked dsRNA.

  # ---- capacity limits ------------------------------------------------------
  # These are what keep the model finite. Without them replication has no ceiling
  # and RNA counts run to 10^11, which is roughly 10^5 times the real value. They
  # are biology, not numerical hygiene: cells have finite membrane, finite
  # ribosomes, and a bounded number of replication complexes per vesicle.

  DMV_max:
    value: 1.0e2
    units: vesicles/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Soft ceiling on DMV number, set by available donor membrane. smFISH counts
      ~30 replication factories per cell at 10 hpi, so this ceiling should end up
      being approached but not saturated over 24 h — a direct calibration handle.

  ribosome_capacity:
    value: 1.0e4
    units: molecules/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Total viral mRNA at which per-message translation output halves. Stands in
      for competition for the ribosome pool, and implicitly for nsp1-driven host
      shutoff freeing ribosomes — a simplification worth revisiting, since nsp1
      should raise this for viral messages while lowering it for host ones.

  K_template:
    value: 1.0e3
    units: molecules/cell
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: >
      Genome count at which negative-strand synthesis per DMV half-saturates.
      Above this, total synthesis tracks DMV count rather than template count.

  K_negstrand:
    value: 1.0e2
    units: molecules/cell
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: Negative-strand count at which positive/subgenomic synthesis saturates.

  k_deg_ngRNA:
    value: 1.0e-5
    units: 1/s
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: Negative strands are stable and long-lived inside DMVs.

  k_deg_dsRNA_dmv:
    value: 1.0e-4
    units: 1/s
    compartment: dmv
    confidence: estimated
    source: UNVERIFIED
    note: Turnover of shielded replication intermediates.

  # ---- assembly and egress -------------------------------------------------

  k_encapsidate:
    value: 1.0e-9
    units: 1/(molecule*s)
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Deliberately slow so that genome is not instantly consumed by assembly, which
      would starve replication of templates. In reality the competition between
      "genome as template" and "genome as cargo" is regulated; v0 fakes that with a
      small rate constant. Flagged as a structural weakness, not just a number.

  k_bud:
    value: 1.0e-8
    units: 1/(molecule*s)
    compartment: ergic
    confidence: estimated
    source: UNVERIFIED
    note: RNP budding into ERGIC membranes bearing S/M/E.

  k_egress:
    value: 1.0e-3
    units: 1/s
    compartment: ergic
    confidence: estimated
    source: UNVERIFIED
    note: Trafficking and release of assembled virions, ~15 min.

  # ---- turnover ------------------------------------------------------------

  k_deg_gRNA:
    value: 1.0e-5
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Slow, per the smFISH finding that genomic RNA is long-lived after entry and
      appears to evade cellular nucleases.

  k_deg_sgRNA:
    value: 5.0e-5
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: Faster than genomic RNA; ordinary mRNA turnover.

  k_rnasel_max:
    value: 1.0e-3
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Maximal OAS/RNase L-driven viral RNA cleavage rate at full antiviral state.
      This is the parameter that makes the abortive outcome an outcome rather than
      a delay, so the position of the productive/abortive boundary is more
      sensitive to it than to anything except ISG_half_block and k_dsRNA_leak.

  k_deg_nsp:
    value: 1.0e-5
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  k_deg_protein:
    value: 1.0e-5
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: One turnover rate shared by all viral proteins in v0. Split when calibrating.

  # ---- innate immunity -----------------------------------------------------

  RIGI_0:
    value: 1.0e4
    units: molecules/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  IRF3_0:
    value: 1.0e4
    units: molecules/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  k_sense:
    value: 1.0e-6
    units: 1/(molecule*s)
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: RIG-I/MDA5 activation by cytosolic dsRNA. Lumps both sensors in v0.

  k_rigi_off:
    value: 1.0e-3
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  k_activate_irf3:
    value: 1.0e-7
    units: 1/(molecule*s)
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: Lumps MAVS signalling and TBK1-mediated IRF3 phosphorylation.

  k_irf3_off:
    value: 1.0e-3
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  k_produce_ifn:
    value: 1.0e-3
    units: 1/s per active IRF3
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  k_deg_ifn:
    value: 1.0e-4
    units: 1/s
    compartment: extracellular
    confidence: estimated
    source: UNVERIFIED
    note: >
      In a single well-mixed cell this stands in for both decay and diffusion away
      from the cell. At tissue scale it becomes a transport term instead.

  k_induce_isg:
    value: 1.0e-3
    units: 1/s per IFN
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: Lumps IFNAR binding, JAK/STAT signalling and ISG transcription.

  k_deg_isg:
    value: 5.0e-5
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      Decay of the antiviral state. Together with k_isg_to_rigi this sets whether
      the IFN arm is bistable at all — the two are the bistability's control knobs.

  k_isg_to_rigi:
    value: 1.0e-4
    units: 1/s per ISG
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      The positive feedback: the antiviral state raises sensing capacity. RIG-I and
      MDA5 are themselves ISGs, so this is real biology, but the strength is a guess.

  k_rigi_basal:
    value: 1.0
    units: molecules/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: Basal synthesis holding RIG-I at RIGI_0 against k_deg_rigi before infection.

  k_deg_rigi:
    value: 1.0e-4
    units: 1/s
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED

  # ---- coupling strengths --------------------------------------------------

  ISG_half_block:
    value: 1.0e4
    units: molecules/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      ISG level at which viral translation and replication are halved. Sets where
      the outcome flips, so the IFN slider's behaviour is more sensitive to this
      than to almost anything else. Top of the sensitivity sweep.

  nsp1_half_block:
    value: 1.0e4
    units: molecules/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: nsp1 level halving IFN production.

  ORF6_half_block:
    value: 1.0e4
    units: molecules/cell
    compartment: cytoplasm
    confidence: estimated
    source: UNVERIFIED
    note: >
      ORF6 level halving ISG induction. Together with nsp1_half_block this decides
      whether the high-viral-load / low-IFN evader cells seen in GSE157526 exist.
